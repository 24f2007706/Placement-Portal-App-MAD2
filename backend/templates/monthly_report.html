<!DOCTYPE html>
<html>
<head>
    <title>Monthly Report</title>
</head>
<body>

<h2>Monthly Placement Activity Report</h2>

<table>

    <tr>
        <th>Student ID</th>
        <th>Job Title</th>
        <th>Status</th>
    </tr>

    {% for item in details %}

    <tr>
        <td>{{ item.student_id }}</td>
        <td>{{ item.job_title }}</td>
        <td>{{ item.status }}</td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
