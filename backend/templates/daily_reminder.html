<!DOCTYPE html>
<html>
<head>
    <title>Placement Reminder</title>
</head>
<body>

    <h2>Placement Drive Reminder</h2>

    <p>Hello {{ student.username }},</p>

    <p>

    <p>Please submit your application before the deadline.</p>

    <p>Placement Cell</p>

</body>
</html>
